apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: hrisapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          ports:
            - containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: hrisapp
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
